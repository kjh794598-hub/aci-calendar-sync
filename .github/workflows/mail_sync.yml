name: Sync ACI Mail to Gmail

on:
  workflow_dispatch:
    inputs:
      send_draft:
        description: 'Send latest draft immediately'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  mail-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Mail Sync
        env:
          ACI_MAIL_PASSWORD: ${{ secrets.ACI_MAIL_PASSWORD }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SEND_LATEST_DRAFT: ${{ github.event.inputs.send_draft || 'false' }}
        run: python mail_sync.py

      - name: Save synced mail log
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add synced_mails.txt
          git diff --staged --quiet || (git commit -m "Update synced mails log" && git pull --rebase origin main && git push)
