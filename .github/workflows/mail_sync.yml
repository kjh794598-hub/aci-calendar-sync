name: ACI Mail Sync

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Mail Sync
        env:
          ACI_MAIL_PASSWORD: ${{ secrets.ACI_MAIL_PASSWORD }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python mail_sync.py

      - name: Save Synced Mail IDs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f synced_mails.txt ]; then
            git add synced_mails.txt
            git diff --staged --quiet || git commit -m "Update synced mails list"
            git push
          fi
