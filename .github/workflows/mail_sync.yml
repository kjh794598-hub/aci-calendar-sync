name: ACI Mail Sync

on:
  workflow_dispatch:

concurrency:
  group: aci-repo-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run mail sync
        env:
          ACI_MAIL_PASSWORD: ${{ secrets.ACI_MAIL_PASSWORD }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python mail_sync.py

      - name: Save synced mail log
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add synced_mails.txt
          git diff --staged --quiet || (git commit -m "Update synced_mails.txt" && git pull --rebase origin main && git push)
